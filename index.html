<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>어업생산량 현황 대시보드</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,'Noto Sans KR',sans-serif}.wrap{max-width:1400px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#123b66,#1976a8);color:white;padding:28px;border-radius:18px}.hero h1{margin:0 0 8px}.filters,.card,.panel{background:white;border:1px solid #e2e8f0;border-radius:15px;padding:18px;box-shadow:0 5px 18px #123b6610}.filters{margin:18px 0;display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr;gap:12px}label{font-size:13px;font-weight:bold}select,input{width:100%;height:40px;margin-top:6px;border:1px solid #ccd6e2;border-radius:8px;padding:0 9px;box-sizing:border-box}button{height:40px;margin-top:21px;border:0;border-radius:8px;background:#1769aa;color:white;font-weight:bold;width:100%}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.value{font-size:26px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chart{height:300px}.table{grid-column:1/-1;overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:10px;border-bottom:1px solid #e8edf3;text-align:right}th:first-child,td:first-child{text-align:center}th{background:#f7f9fc;position:sticky;top:0}.peak{background:#fff2bf;font-weight:bold}@media(max-width:850px){.filters,.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:12px}.cards{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="hero"><h1>어업생산량 현황 대시보드</h1><div>데이터 기간: 2001~2013 · 단위: 천M/T · 2008년 최고 생산량 강조</div></header><section class="filters"><div><label>시작 연도</label><select id="from"></select></div><div><label>종료 연도</label><select id="to"></select></div><div><label>품종 선택</label><select id="kind"><option value="total">계</option><option value="fish">어류</option><option value="shell">패류</option><option value="crab">갑각류</option><option value="mollusk">연체동물</option><option value="other">기타수산동물</option><option value="seaweed">해조류</option></select></div><div><button id="reset">초기화</button></div></section><section class="cards"><div class="card"><small>선택 기간 총 생산량</small><div class="value" id="sum">-</div></div><div class="card"><small>평균 연간 생산량</small><div class="value" id="avg">-</div></div><div class="card"><small>최고 생산 연도</small><div class="value" id="peak">-</div></div><div class="card"><small>표시 연도 수</small><div class="value" id="count">-</div></div></section><section class="grid"><div class="panel"><h2>연도별 총 생산량 추이</h2><div class="chart"><canvas id="line"></canvas></div></div><div class="panel"><h2>품종별 생산량 합계</h2><div class="chart"><canvas id="bar"></canvas></div></div><div class="panel"><h2>어류 vs 해조류</h2><div class="chart"><canvas id="compare"></canvas></div></div><div class="panel table"><h2>연도별 데이터</h2><table><thead><tr><th>연도</th><th>계</th><th>어류</th><th>패류</th><th>갑각류</th><th>연체동물</th><th>기타수산동물</th><th>해조류</th></tr></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table></div></section></main><script>const D=[
[2001,2665,1467,283,74,413,39,388],[2002,2476,1202,272,72,394,27,508],[2003,2487,1144,403,89,379,15,457],[2004,2519,1157,410,85,306,15,546],[2005,2714,1265,409,92,295,16,636],[2006,3032,1261,474,110,392,17,778],[2007,3275,1330,555,124,432,23,811],[2008,3361,1448,428,126,402,23,935],[2009,3182,1425,420,132,312,24,870],[2010,3111,1331,440,147,256,22,915],[2011,3256,1356,467,130,269,28,1007],[2012,3183,1268,433,135,293,23,1032],[2013,3135,1195,346,149,282,23,1140]];const K=['total','fish','shell','crab','mollusk','other','seaweed'],N=['계','어류','패류','갑각류','연체동물','기타수산동물','해조류'],fmt=n=>n.toLocaleString('ko-KR');for(let y=2001;y<=2013;y++){from.innerHTML+=`<option>${y}</option>`;to.innerHTML+=`<option>${y}</option>`}from.value=2001;to.value=2013;function get(){let a=+from.value,b=+to.value;if(a>b)[a,b]=[b,a];let ki=K.indexOf(kind.value)+1;return D.filter(r=>r[0]>=a&&r[0]<=b&&r[ki]<=3361)}let charts=[];function render(){let rows=get(),vals=rows.map(r=>r.slice(1)),tot=rows.reduce((s,r)=>s+r[1],0),pk=rows.reduce((x,r)=>r[1]>x[1]?r:x,rows[0]);sum.textContent=fmt(tot)+' 천M/T';avg.textContent=rows.length?fmt(Math.round(tot/rows.length)):'-';peak.textContent=pk?pk[0]+'년':'-';count.textContent=rows.length;tbody.innerHTML=rows.map(r=>`<tr class="${r[0]===2008?'peak':''}">${r.map((v,i)=>`<td>${i?fmt(v):v}</td>`).join('')}</tr>`).join('');let s=[1,2,3,4,5,6].map(i=>rows.reduce((a,r)=>a+r[i+1],0));tfoot.innerHTML='<tr>'+['합계',...s].map((v,i)=>`<td>${i?fmt(v):v}</td>`).join('')+'</tr>';charts.forEach(c=>c.destroy());let years=rows.map(r=>r[0]);charts.push(new Chart(line,{type:'line',data:{labels:years,datasets:[{label:'계',data:rows.map(r=>r[1]),tension:.25,pointRadius:rows.map(r=>r[0]===2008?7:3)}]}}));charts.push(new Chart(bar,{type:'bar',data:{labels:N,datasets:[{label:'생산량 합계',data:s}]}}));charts.push(new Chart(compare,{type:'line',data:{labels:years,datasets:[{label:'어류',data:rows.map(r=>r[2]),tension:.2},{label:'해조류',data:rows.map(r=>r[7]),tension:.2}]}}))}document.querySelectorAll('select').forEach(x=>x.onchange=render);reset.onclick=()=>{from.value=2001;to.value=2013;kind.value='total';render()};render();</script></body></html>
