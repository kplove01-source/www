<html lang="ko">

  <style>
    :root { --bg:#f5f7fb; --panel:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --primary:#2563eb; --primary-soft:#eff6ff; --shadow:0 10px 30px rgba(15,23,42,.06); }
    *{box-sizing:border-box} body{margin:0;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
    .wrap{width:min(1400px,calc(100% - 32px));margin:0 auto;padding:32px 0 48px}.hero{background:linear-gradient(135deg,#1d4ed8,#2563eb 55%,#3b82f6);color:#fff;border-radius:20px;padding:28px;box-shadow:var(--shadow);margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px)}.hero p{margin:0;opacity:.9;font-size:15px}
    .controls{display:grid;grid-template-columns:1.5fr .7fr auto;gap:12px;background:var(--panel);padding:18px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px}input,select,button{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:15px;padding:0 14px;outline:none}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}button{width:auto;min-width:110px;border:0;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.status{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);padding:14px 18px;border-radius:14px;margin-bottom:16px;border:1px solid var(--line)}.count{font-weight:800;color:var(--primary)}.source{color:var(--muted);font-size:13px}.table-shell{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;min-width:1500px;font-size:14px}thead{background:#f8fafc;position:sticky;top:0;z-index:1}th,td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}th{font-weight:800;color:#334155}tbody tr:hover{background:var(--primary-soft)}.mobile-list{display:none}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.mobile-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 16px rgba(15,23,42,.04)}.mobile-card h3{margin:0 0 12px;color:var(--primary);font-size:18px}.mobile-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.mobile-item{background:#f8fafc;border-radius:10px;padding:9px;min-width:0}.mobile-item .label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;word-break:keep-all}.mobile-item .value{display:block;font-size:14px;font-weight:700;word-break:break-word}.footer-note{margin-top:14px;color:var(--muted);font-size:12px;text-align:right}
    @media(max-width:700px){.wrap{width:min(100% - 20px,100%);padding-top:14px}.hero{border-radius:14px;padding:20px 16px}.controls{grid-template-columns:1fr;padding:14px}button{width:100%}.status{align-items:flex-start;flex-direction:column}.table-shell{display:none}.mobile-list{display:block}}@media(max-width:400px){.wrap{width:calc(100% - 16px)}.hero{padding:18px 14px}.hero h1{font-size:23px}.mobile-grid{grid-template-columns:1fr 1fr}.mobile-item{padding:8px}}
  </style>
</head>
<body>
<main class="wrap"><section class="hero"><h1>해양사고 통계 조회</h1><p>연도와 사고 유형을 검색하고 연도별 데이터를 빠르게 확인할 수 있습니다.</p></section>

<section class="status"><div>결과 <span id="visibleCount" class="count">0</span>건 / 전체 <span id="totalCount" class="count">0</span>건</div><div class="source">출처: 제공된 data.json · 기준 시점: 1998~2012년</div></section>
<section class="table-shell" aria-label="데이터 표"><div class="table-scroll"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div></section><section id="mobileList" class="mobile-list" aria-label="모바일 데이터 목록"></section><div class="footer-note">검색어가 사고 유형명과 일치하면 해당 사고 유형 값이 1건 이상인 연도만 표시됩니다.</div></main>

const searchInput=document.getElementById('searchInput'),yearFilter=document.getElementById('yearFilter'),resetBtn=document.getElementById('resetBtn'),tableHead=document.getElementById('tableHead'),tableBody=document.getElementById('tableBody'),mobileList=document.getElementById('mobileList'),visibleCount=document.getElementById('visibleCount'),totalCount=document.getElementById('totalCount');
const columns=DATA.length?Object.keys(DATA[0]):[],accidentTypes=columns.filter(col=>!['시점','총계'].includes(col));
function init(){totalCount.textContent=DATA.length.toLocaleString('ko-KR');const years=[...new Set(DATA.map(row=>row['시점']))].sort((a,b)=>a-b);yearFilter.insertAdjacentHTML('beforeend',years.map(year=>`<option value="${year}">${year}년</option>`).join(''));tableHead.innerHTML=`<tr>${columns.map(col=>`<th scope="col">${escapeHtml(col)}</th>`).join('')}</tr>`;render(DATA)}
function applyFilters(){const keyword=searchInput.value.trim(),selectedYear=yearFilter.value;let filtered=DATA.filter(row=>{const yearMatched=!selectedYear||String(row['시점'])===selectedYear;if(!yearMatched)return false;if(!keyword)return true;const normalized=keyword.toLowerCase();if(String(row['시점']).includes(normalized))return true;const matchedTypes=accidentTypes.filter(type=>type.toLowerCase().includes(normalized));if(matchedTypes.length>0)return matchedTypes.some(type=>Number(row[type])>0);return Object.values(row).some(value=>String(value).toLowerCase().includes(normalized))});render(filtered)}
function render(rows){visibleCount.textContent=rows.length.toLocaleString('ko-KR');if(!rows.length){tableBody.innerHTML=`<tr><td colspan="${columns.length}" class="empty">검색 결과가 없습니다.</td></tr>`;mobileList.innerHTML=`<div class="empty">검색 결과가 없습니다.</div>`;return}tableBody.innerHTML=rows.map(row=>`<tr>${columns.map(col=>`<td>${formatValue(row[col])}</td>`).join('')}</tr>`).join('');mobileList.innerHTML=rows.map(row=>`<article class="mobile-card"><h3>${escapeHtml(String(row['시점']))}년 · 총계 ${formatValue(row['총계'])}건</h3><div class="mobile-grid">${columns.filter(col=>!['시점','총계'].includes(col)).map(col=>`<div class="mobile-item"><span class="label">${escapeHtml(col)}</span><span class="value">${formatValue(row[col])}</span></div>`).join('')}</div></article>`).join('')}
function formatValue(value){return typeof value==='number'?value.toLocaleString('ko-KR'):escapeHtml(String(value??''))}function escapeHtml(value){return value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
searchInput.addEventListener('input',applyFilters);yearFilter.addEventListener('change',applyFilters);resetBtn.addEventListener('click',()=>{searchInput.value='';yearFilter.value='';render(DATA);searchInput.focus()});init();
</script></body></html>
